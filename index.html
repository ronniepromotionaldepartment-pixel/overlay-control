<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Live Overlay Controller</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #38bdf8;
            font-size: 1.5rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 6px;
            padding: 0.75rem;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus {
            border-color: #38bdf8;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Global Overlay Controller</h2>

    <div class="form-group">
        <label for="liveText">Live Overlay Text</label>
        <textarea id="liveText" placeholder="Type here from anywhere..." oninput="sendUpdate()"></textarea>
    </div>

    <div class="form-group">
        <label for="fontSize">Text Size (<span id="sizeVal">16</span>px)</label>
        <div class="slider-group">
            <input type="range" id="fontSize" min="10" max="48" value="16" oninput="updateSizeVal(); sendUpdate();">
        </div>
    </div>

    <div class="form-group">
        <label for="opacity">Window Opacity (<span id="opacityVal">85</span>%)</label>
        <div class="slider-group">
            <input type="range" id="opacity" min="0.1" max="1.0" step="0.05" value="0.85" oninput="updateOpacityVal(); sendUpdate();">
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://zrrkmywhcytyayvxfvsp.supabase.co";
    const SUPABASE_KEY = "sb_publishable__Hlp0IbC-fIBbVjxLkvOYQ_jgcbjN02";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const channel = supabase.channel('overlay-channel');

    channel.subscribe((status) => {
        if (status === 'SUBSCRIBED') {
            console.log('Connected to Supabase Realtime!');
        }
    });

    function sendUpdate() {
        const text = document.getElementById('liveText').value;
        const fontSize = document.getElementById('fontSize').value;
        const opacity = document.getElementById('opacity').value;

        channel.send({
            type: 'broadcast',
            event: 'text-update',
            payload: {
                text: text,
                fontSize: parseInt(fontSize),
                opacity: parseFloat(opacity)
            }
        });
    }

    function updateSizeVal() {
        document.getElementById('sizeVal').innerText = document.getElementById('fontSize').value;
    }

    function updateOpacityVal() {
        document.getElementById('opacityVal').innerText = Math.round(document.getElementById('opacity').value * 100);
    }
</script>

</body>
</html>
